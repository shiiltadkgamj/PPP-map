<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ウォーターPPP・群マネ 実施/検討マップ</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIINfQkEC2pVTdSpPwkTs4R4JkMlfdU7pDQ=" crossorigin="">
  <style>
    :root {
      --ink: #172026;
      --muted: #63717d;
      --line: #d9e3e7;
      --paper: #f5f7f6;
      --panel: #ffffff;
      --water: #0877a9;
      --group: #b4541b;
      --concession: #0f6b8f;
      --management: #6b6f18;
      --gunmane: #9b4b1f;
      --active: #107047;
      --open: #8c4cbd;
      --plan: #806200;
      --shadow: 0 14px 36px rgba(29, 45, 57, .16);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: "Yu Gothic UI", "Hiragino Kaku Gothic ProN", Meiryo, system-ui, sans-serif;
      letter-spacing: 0;
    }

    .app {
      display: grid;
      grid-template-columns: 380px minmax(0, 1fr);
      height: 100vh;
      min-height: 620px;
      overflow: hidden;
    }

    aside {
      position: relative;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 18px;
      min-height: 0;
      overflow: hidden;
      border-right: 1px solid var(--line);
      background: rgba(255, 255, 255, .96);
      box-shadow: 8px 0 24px rgba(33, 49, 59, .07);
    }

    h1 {
      margin: 0;
      font-size: 21px;
      line-height: 1.35;
      font-weight: 800;
    }

    .sub {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-block {
      display: grid;
      gap: 7px;
    }

    .filter-caption {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .toggle {
      flex: 1 1 160px;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 42px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font-weight: 700;
      cursor: pointer;
    }

    .toggle input { accent-color: var(--active); }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      flex: 0 0 auto;
    }
    .dot.water { background: var(--water); }
    .dot.group { background: var(--group); }
    .dot.concession { background: var(--concession); }
    .dot.management { background: var(--management); }
    .dot.gunmane { background: var(--gunmane); }

    .search {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .search span {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .search input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      font: inherit;
      background: transparent;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .stat {
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .stat strong {
      display: block;
      font-size: 22px;
      line-height: 1;
    }

    .stat span {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .latest {
      display: grid;
      gap: 8px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .latest-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .latest-head strong {
      font-size: 13px;
    }

    .latest-head span {
      color: var(--muted);
      font-size: 11px;
      text-align: right;
    }

    .latest-feed {
      display: grid;
      gap: 7px;
      max-height: 150px;
      overflow: auto;
    }

    .latest-feed a,
    .latest-feed .latest-empty {
      display: grid;
      gap: 3px;
      padding: 8px;
      border: 1px solid #edf2f3;
      border-radius: 8px;
      color: var(--ink);
      text-decoration: none;
      background: #f9fbfb;
      font-size: 12px;
      line-height: 1.35;
    }

    .latest-feed a:hover { border-color: #93b5bb; }
    .latest-feed small { color: var(--muted); }

    .list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
      overflow: auto;
      padding-right: 2px;
    }

    .item {
      width: 100%;
      border: 1px solid var(--line);
      border-left-width: 5px;
      border-radius: 8px;
      background: #fff;
      padding: 12px;
      text-align: left;
      cursor: pointer;
      transition: box-shadow .15s, transform .15s;
    }

    .item.water { border-left-color: var(--water); }
    .item.group { border-left-color: var(--group); }
    .item:hover, .item.selected {
      box-shadow: 0 8px 18px rgba(31, 46, 54, .12);
      transform: translateY(-1px);
    }

    .meta {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 3px 7px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .badge.active { color: var(--active); background: #dff5e9; }
    .badge.open { color: var(--open); background: #f1e5fb; }
    .badge.plan { color: var(--plan); background: #fff4bf; }
    .badge.source { color: #26526c; background: #e4f3fa; }
    .badge.watch { color: #6b5b16; background: #fff5c7; }
    .badge.concession { color: var(--concession); background: #e1f2f7; }
    .badge.management { color: var(--management); background: #f0f4cf; }
    .badge.gunmane { color: var(--gunmane); background: #f8e6da; }

    .item h2 {
      margin: 0;
      font-size: 15px;
      line-height: 1.4;
    }

    .item p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    main {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: #dfe9e9;
    }

    #map {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    .leaflet-container {
      overflow: hidden;
      background: #dfe9e9;
      outline-offset: 1px;
    }

    .leaflet-pane,
    .leaflet-tile,
    .leaflet-marker-icon,
    .leaflet-marker-shadow,
    .leaflet-tile-container,
    .leaflet-pane > svg,
    .leaflet-pane > canvas,
    .leaflet-zoom-box,
    .leaflet-image-layer,
    .leaflet-layer {
      position: absolute;
      left: 0;
      top: 0;
    }

    .leaflet-tile,
    .leaflet-marker-icon,
    .leaflet-marker-shadow {
      user-select: none;
      -webkit-user-drag: none;
    }

    .leaflet-marker-icon,
    .leaflet-marker-shadow {
      display: block;
    }

    .leaflet-control {
      position: relative;
      z-index: 800;
      pointer-events: auto;
    }

    .leaflet-top,
    .leaflet-bottom {
      position: absolute;
      z-index: 1000;
      pointer-events: none;
    }

    .leaflet-top { top: 0; }
    .leaflet-right { right: 0; }
    .leaflet-bottom { bottom: 0; }
    .leaflet-left { left: 0; }

    .leaflet-control-zoom {
      margin-top: 82px;
      margin-left: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 22px rgba(38, 55, 61, .08);
    }

    .leaflet-control-zoom a {
      display: block;
      width: 34px;
      height: 34px;
      line-height: 34px;
      background: #fff;
      color: var(--ink);
      text-align: center;
      text-decoration: none;
      font-size: 20px;
      font-weight: 800;
      border-bottom: 1px solid var(--line);
    }

    .leaflet-control-zoom a:last-child { border-bottom: 0; }

    .leaflet-popup {
      position: absolute;
      text-align: center;
      margin-bottom: 20px;
    }

    .leaflet-popup-content-wrapper {
      padding: 1px;
      text-align: left;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 7px 24px rgba(0,0,0,.2);
    }

    .leaflet-popup-tip-container {
      width: 40px;
      height: 20px;
      position: absolute;
      left: 50%;
      margin-left: -20px;
      overflow: hidden;
      pointer-events: none;
    }

    .leaflet-popup-tip {
      width: 14px;
      height: 14px;
      padding: 1px;
      margin: -7px auto 0;
      transform: rotate(45deg);
      background: #fff;
      box-shadow: 0 7px 24px rgba(0,0,0,.2);
    }

    .map-head {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      pointer-events: none;
    }

    .update {
      max-width: 590px;
      padding: 10px 12px;
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 8px;
      background: rgba(255,255,255,.9);
      box-shadow: 0 8px 22px rgba(38, 55, 61, .08);
      font-size: 13px;
      line-height: 1.45;
    }

    .update strong { color: var(--active); }

    .map-actions {
      display: flex;
      gap: 6px;
      pointer-events: auto;
    }

    .map-actions button {
      min-width: 72px;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(38, 55, 61, .08);
    }

    .detail {
      position: absolute;
      right: 18px;
      bottom: 18px;
      z-index: 10;
      width: min(460px, calc(100vw - 40px));
      max-height: calc(100vh - 118px);
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,.97);
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .detail h2 {
      margin: 8px 0 8px;
      font-size: 20px;
      line-height: 1.35;
    }

    .detail p {
      color: var(--muted);
      line-height: 1.65;
      margin: 0 0 12px;
      font-size: 14px;
    }

    .detail dl {
      display: grid;
      grid-template-columns: 126px 1fr;
      gap: 8px 12px;
      margin: 12px 0;
      font-size: 14px;
    }

    .detail dt { color: var(--muted); }
    .detail dd { margin: 0; font-weight: 700; }

    .sources {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }

    .sources a {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      text-decoration: none;
      background: #fff;
      font-size: 13px;
      line-height: 1.35;
    }

    .sources .source-note {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      background: #f8faf9;
      font-size: 13px;
      line-height: 1.35;
    }

    .sources a:hover { border-color: #93b5bb; }

    .pin {
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      border: 3px solid #fff;
      border-radius: 999px;
      box-shadow: 0 5px 14px rgba(0,0,0,.32);
    }

    .pin.water { background: var(--water); }
    .pin.group { background: var(--group); }
    .pin.open { outline: 3px solid rgba(140, 76, 189, .34); }
    .pin.plan { outline: 3px solid rgba(128, 98, 0, .32); }
    .pin::after {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: #fff;
    }

    .leaflet-popup-content {
      min-width: 240px;
      margin: 12px;
      font-family: "Yu Gothic UI", "Hiragino Kaku Gothic ProN", Meiryo, system-ui, sans-serif;
    }

    .popup-kind {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .popup-title {
      margin: 4px 0 6px;
      font-size: 15px;
      font-weight: 800;
      line-height: 1.35;
    }

    .popup-row {
      display: grid;
      grid-template-columns: 58px 1fr;
      gap: 5px 8px;
      font-size: 12px;
      line-height: 1.45;
    }

    .popup-row span:nth-child(odd) { color: var(--muted); }
    .popup-row span:nth-child(even) { font-weight: 700; }

    .empty {
      display: grid;
      place-items: center;
      height: 100%;
      min-height: 160px;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
    }

    .leaflet-control-attribution {
      font-size: 10px;
    }

    @media (max-width: 900px) {
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(260px, 45vh) minmax(590px, 1fr);
        height: 100vh;
      }
      aside {
        max-height: none;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      .detail {
        left: 12px;
        right: 12px;
        bottom: 12px;
        width: auto;
        max-height: 40vh;
      }
      .map-head {
        top: 10px;
        left: 10px;
        right: 10px;
      }
      .update { max-width: calc(100% - 90px); }
      .map-actions button {
        min-width: 58px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <header>
        <h1>ウォーターPPP・群マネ 実施/検討マップ</h1>
        <p class="sub">実施中・公募中・検討/準備中の案件を、実座標の地図上で確認できます。断定できない案件は「継続確認」として区別しています。</p>
      </header>

      <div class="filter-block">
        <span class="filter-caption">分類</span>
        <div class="toolbar" aria-label="表示フィルター">
          <label class="toggle"><input id="filterWater" type="checkbox" checked><span class="dot water"></span>ウォーターPPP</label>
          <label class="toggle"><input id="filterGroup" type="checkbox" checked><span class="dot group"></span>群マネ</label>
        </div>
      </div>

      <div class="filter-block">
        <span class="filter-caption">方式</span>
        <div class="toolbar" aria-label="方式フィルター">
          <label class="toggle"><input id="filterConcession" type="checkbox" checked><span class="dot concession"></span>コンセッション</label>
          <label class="toggle"><input id="filterManagement" type="checkbox" checked><span class="dot management"></span>管理・更新一体</label>
          <label class="toggle"><input id="filterGunmane" type="checkbox" checked><span class="dot gunmane"></span>群マネ/包括管理</label>
        </div>
      </div>

      <label class="search" aria-label="地域や内容で検索">
        <span>検索</span>
        <input id="search" type="search" placeholder="自治体名、方式、内容、ステータス">
      </label>

      <div class="stats" aria-label="表示件数">
        <div class="stat"><strong id="countAll">0</strong><span>表示中</span></div>
        <div class="stat"><strong id="countOpen">0</strong><span>実施/選定</span></div>
        <div class="stat"><strong id="countPlan">0</strong><span>制度/準備</span></div>
      </div>

      <section class="latest" aria-label="自動収集された最新情報">
        <div class="latest-head">
          <strong>最新情報</strong>
          <span id="latestGeneratedAt">自動更新データ読込中</span>
        </div>
        <div id="latestFeed" class="latest-feed">
          <div class="latest-empty">国交省等の国のHP、日経関連、Googleニュース検索から更新情報を確認しています。</div>
        </div>
      </section>

      <div id="list" class="list" aria-label="案件一覧"></div>
    </aside>

    <main>
      <div id="map" aria-label="正確な日本地図"></div>
      <div class="map-head">
        <div class="update">
          <strong>地図: OpenStreetMap実座標</strong><br>
          地図案件は確認済み資料を優先。最新情報はGitHub Actionsで6時間ごとに自動収集。表示更新: <span id="updatedAt"></span>
        </div>
        <div class="map-actions" aria-label="地図操作">
          <button id="reset" type="button">日本全体</button>
        </div>
      </div>
      <section id="detail" class="detail" aria-live="polite"></section>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    const typeLabel = { water: "ウォーターPPP", group: "群マネ" };
    const methodLabel = {
      concession: "コンセッション方式",
      management: "管理・更新一体マネジメント方式",
      gunmane: "群マネ/包括管理"
    };
    const statusClass = { active: "active", open: "open", plan: "plan" };
    const typeClass = { water: "water", group: "group" };
    const methodClass = { concession: "concession", management: "management", gunmane: "gunmane" };
    const japanBounds = L.latLngBounds([24.0, 122.0], [46.8, 146.5]);
    const map = L.map("map", {
      zoomControl: true,
      minZoom: 4,
      maxZoom: 18,
      zoomAnimation: false,
      fadeAnimation: false
    });
    const markers = new Map();
    let selectedId = projects[0].id;

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);

    function fitJapan() {
      map.invalidateSize();
      map.fitBounds(japanBounds, { padding: [28, 28] });
    }

    fitJapan();
    window.addEventListener("resize", () => {
      window.clearTimeout(window.__fitJapanTimer);
      window.__fitJapanTimer = window.setTimeout(() => map.invalidateSize(), 120);
    });

    const listEl = document.getElementById("list");
    const detailEl = document.getElementById("detail");
    const filterWater = document.getElementById("filterWater");
    const filterGroup = document.getElementById("filterGroup");
    const methodFilters = {
      concession: document.getElementById("filterConcession"),
      management: document.getElementById("filterManagement"),
      gunmane: document.getElementById("filterGunmane")
    };
    const search = document.getElementById("search");
    const countAll = document.getElementById("countAll");
    const countOpen = document.getElementById("countOpen");
    const countPlan = document.getElementById("countPlan");
    const updatedAt = document.getElementById("updatedAt");
    const latestFeed = document.getElementById("latestFeed");
    const latestGeneratedAt = document.getElementById("latestGeneratedAt");

    function markerIcon(project) {
      return L.divIcon({
        className: "",
        html: `<span class="pin ${typeClass[project.type]} ${statusClass[project.status]}"></span>`,
        iconSize: [24, 24],
        iconAnchor: [12, 12],
        popupAnchor: [0, -12]
      });
    }

    function popupHtml(project) {
      return `
        <div class="popup-kind">${typeLabel[project.type]} / ${methodLabel[project.method]} / ${project.statusLabel}</div>
        <div class="popup-title">${project.place}</div>
        <div class="popup-row">
          <span>内容</span><span>${project.title}</span>
          <span>方式</span><span>${methodLabel[project.method]}</span>
          <span>対象</span><span>${project.area}</span>
          <span>期間</span><span>${project.period}</span>
        </div>
      `;
    }

    function visibleProjects() {
      const q = search.value.trim().toLowerCase();
      return projects.filter(project => {
        const typeOn = (project.type === "water" && filterWater.checked) || (project.type === "group" && filterGroup.checked);
        const methodOn = methodFilters[project.method]?.checked ?? true;
        const text = `${project.place} ${project.area} ${project.title} ${project.what} ${project.operator} ${project.period} ${project.statusLabel} ${project.certaintyLabel} ${typeLabel[project.type]} ${methodLabel[project.method]} ${project.sourceDate}`.toLowerCase();
        return typeOn && methodOn && (!q || text.includes(q));
      });
    }

    function syncMarkers(visible) {
      const visibleIds = new Set(visible.map(project => project.id));

      projects.forEach(project => {
        if (!visibleIds.has(project.id) && markers.has(project.id)) {
          map.removeLayer(markers.get(project.id));
          markers.delete(project.id);
        }
      });

      visible.forEach(project => {
        if (markers.has(project.id)) return;
        const marker = L.marker([project.lat, project.lon], { icon: markerIcon(project) })
          .bindPopup(popupHtml(project), { closeButton: false })
          .on("mouseover", () => marker.openPopup())
          .on("mouseout", () => marker.closePopup())
          .on("click", () => selectProject(project.id, true));
        marker.addTo(map);
        markers.set(project.id, marker);
      });
    }

    function renderList(visible) {
      listEl.innerHTML = "";
      visible.forEach(project => {
        const item = document.createElement("button");
        item.className = `item ${typeClass[project.type]} ${project.id === selectedId ? "selected" : ""}`;
        item.type = "button";
        item.innerHTML = `
          <div class="meta">
            <span>${typeLabel[project.type]} / ${project.place}</span>
            <span class="badge ${statusClass[project.status]}">${project.statusLabel}</span>
          </div>
          <h2>${project.title}</h2>
          <p><span class="badge ${methodClass[project.method]}">${methodLabel[project.method]}</span> ${project.period}</p>
        `;
        item.addEventListener("click", () => selectProject(project.id, true));
        listEl.appendChild(item);
      });
    }

    function renderDetail() {
      const project = projects.find(item => item.id === selectedId);
      if (!project) {
        detailEl.innerHTML = `<div class="empty">条件に合う案件がありません。<br>フィルターまたは検索条件を変更してください。</div>`;
        return;
      }

      detailEl.innerHTML = `
        <span class="badge ${statusClass[project.status]}">${project.statusLabel}</span>
        <span class="badge ${project.certainty}">${project.certaintyLabel}</span>
        <span class="badge ${methodClass[project.method]}">${methodLabel[project.method]}</span>
        <h2>${project.place}｜${project.title}</h2>
        <p>${project.what}</p>
        <dl>
          <dt>分類</dt><dd>${typeLabel[project.type]}</dd>
          <dt>方式</dt><dd>${methodLabel[project.method]}</dd>
          <dt>場所</dt><dd>${project.place}</dd>
          <dt>対象</dt><dd>${project.area}</dd>
          <dt>期間</dt><dd>${project.period}</dd>
          <dt>受託/連携主体</dt><dd>${project.operator}</dd>
          <dt>情報基準</dt><dd>${project.sourceDate}</dd>
        </dl>
        <strong>詳細情報・出典確認</strong>
        <div class="sources">
          ${project.sources.map(([label, url]) => url ? `<a href="${url}" target="_blank" rel="noreferrer"><span>${label}</span><span>開く</span></a>` : `<span class="source-note"><span>${label}</span><span>リンクなし</span></span>`).join("")}
        </div>
      `;
    }

    function render() {
      const visible = visibleProjects();
      countAll.textContent = visible.length;
      countOpen.textContent = visible.filter(item => item.status === "open" || item.status === "active").length;
      countPlan.textContent = visible.filter(item => item.status === "plan").length;

      if (!visible.some(item => item.id === selectedId)) {
        selectedId = visible[0]?.id || null;
      }

      syncMarkers(visible);
      renderList(visible);
      renderDetail();
    }

    function selectProject(id, panToMarker) {
      selectedId = id;
      const project = projects.find(item => item.id === id);
      if (project && panToMarker) {
        map.setView([project.lat, project.lon], Math.max(map.getZoom(), 8), { animate: true });
        markers.get(project.id)?.openPopup();
      }
      render();
    }

    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function renderLatestUpdates(payload) {
      const items = Array.isArray(payload?.items) ? payload.items.slice(0, 12) : [];
      latestGeneratedAt.textContent = payload?.generatedAt
        ? `更新: ${new Intl.DateTimeFormat("ja-JP", { dateStyle: "short", timeStyle: "short" }).format(new Date(payload.generatedAt))}`
        : "更新情報なし";

      if (!items.length) {
        latestFeed.innerHTML = `<div class="latest-empty">自動収集された最新情報はまだありません。</div>`;
        return;
      }

      latestFeed.innerHTML = items.map(item => `
        <a href="${escapeHtml(item.url)}" target="_blank" rel="noreferrer">
          <strong>${escapeHtml(item.title)}</strong>
          <small>${escapeHtml(item.source)} / ${escapeHtml(formatPublished(item.published))} / ${escapeHtml(item.query || "")}</small>
        </a>
      `).join("");
    }

    function formatPublished(value) {
      if (!value) return "日付未取得";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return new Intl.DateTimeFormat("ja-JP", { dateStyle: "short", timeStyle: "short" }).format(date);
    }

    async function loadLatestUpdates() {
      try {
        const response = await fetch("data/latest-updates.json", { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        renderLatestUpdates(await response.json());
      } catch (error) {
        latestGeneratedAt.textContent = "自動更新データ未取得";
        latestFeed.innerHTML = `<div class="latest-empty">GitHub Actionsで data/latest-updates.json が生成されると、ここに最新情報が表示されます。</div>`;
      }
    }

    document.getElementById("reset").addEventListener("click", () => {
      fitJapan();
    });
    filterWater.addEventListener("change", render);
    filterGroup.addEventListener("change", render);
    Object.values(methodFilters).forEach(input => input.addEventListener("change", render));
    search.addEventListener("input", render);

    const formatter = new Intl.DateTimeFormat("ja-JP", { dateStyle: "medium", timeStyle: "short" });
    updatedAt.textContent = formatter.format(new Date());
    setInterval(() => { updatedAt.textContent = formatter.format(new Date()); }, 60000);
    render();
    loadLatestUpdates();
    window.setTimeout(fitJapan, 120);
  </script>
